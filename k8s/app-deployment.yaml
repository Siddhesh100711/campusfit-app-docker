apiVersion: apps/v1
kind: Deployment

metadata:
  name: campusfit-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: campusfit-app

  template:
    metadata:
      labels:
        app: campusfit-app

    spec:
      containers:
      - name: campusfit-app
        image: siddhesh0710/campusfit-app:latest
        imagePullPolicy: Always
        
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"

          limits:
            memory: "256Mi"
            cpu: "200m"

        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10

        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5

        ports:
        - containerPort: 3000

        envFrom:
        - configMapRef:
            name: campusfit-config

        - secretRef:
            name: mongo-secret
