apiVersion: apps/v1
kind: Deployment

metadata:
  name: campusfit-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: campusfit-app

  template:
    metadata:
      labels:
        app: campusfit-app

    spec:
      containers:
      - name: campusfit-app
        image: siddhesh0710/campusfit-app:v1

        ports:
        - containerPort: 3000

        envFrom:
        - configMapRef:
            name: campusfit-config

        - secretRef:
            name: mongo-secret
